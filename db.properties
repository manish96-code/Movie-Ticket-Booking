# ====================================================================
# Cinema Express - Database Configuration
# ====================================================================

# Database engine to use: MYSQL or SQLITE
db.type=MYSQL

# --- MySQL Configuration ---
db.mysql.host=localhost
db.mysql.port=3306
db.mysql.database=cinema_db
db.mysql.user=root
db.mysql.password=root
db.mysql.params=?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true

# --- SQLite Configuration (Alternative) ---
db.sqlite.url=jdbc:sqlite:cinema.db
